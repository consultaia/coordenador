<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const sb=(SUPABASE_URL&&SUPABASE_ANON_KEY)?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{db:{schema:"coordenador"}}):null; // tabelas no schema "coordenador" do projeto existente

const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const WD=["D","S","T","Q","Q","S","S"];
const PREFS={misto:"Equilibrado dia/noite",mais_dia:"Mais diurno",mais_noite:"Mais noturno",so_dia:"Só diurno",so_noite:"Só noturno"};
const MENSAL=n=>+(14.90+5*(n-1)).toFixed(2);              // referência mensal por nº de escalas
const PRECO=(n,per)=>+(MENSAL(n)*(per===12?10:5)).toFixed(2); // semestral = 5 mensalidades · anual = 10 (2 meses grátis)

// ---------- motor ----------
function gerarEscala({y,m,eq,ym}){
  const dim=daysInMonth(y,m);const hol=(eq.holidayMap||{})[ym]||[];
  const isFds=d=>isWknd(y,m,d)||hol.includes(d);const dayType=d=>isFds(d)?"fds":"semana";
  const req=(d,tc,fid)=>(((eq.cover||{})[dayType(d)]||{})[tc]||{})[fid]||0;
  const turnoH={};eq.turnos.forEach(t=>turnoH[t.code]=t.horas);
  const autoTurnos=eq.turnos.filter(t=>t.auto);const autoCodes=new Set(autoTurnos.map(t=>t.code));
  const cur=(eq.sched||{})[ym]||{};const next={};eq.profs.forEach(p=>next[p.id]={});
  eq.profs.forEach(p=>{const r=cur[p.id]||{};for(const d in r){const v=r[d];if(v&&v!=="F"&&!autoCodes.has(v))next[p.id][d]=v;}});
  const ds=eq.diasSemana||6;let dc=0;
  for(let d=1;d<=dim;d++){const w=wdOf(y,m,d);const off=ds>=6?w===0:(w===0||w===6);if(!off&&!hol.includes(d))dc++;}
  const tgt={},hrs={},dia={},noi={},fds={},fer={};
  eq.profs.forEach(p=>{tgt[p.id]=Math.round((p.weekly||0)/ds*dc);hrs[p.id]=0;dia[p.id]=0;noi[p.id]=0;fds[p.id]=0;fer[p.id]=0;
    for(const d in next[p.id])hrs[p.id]+=turnoH[next[p.id][d]]||0;});
  const busy=(id,d)=>{const v=next[id][d];return v!=null&&v!=="";};
  const longPrev=(id,d)=>{const v=next[id][d-1];return !!v&&(turnoH[v]||0)>=12;};
  const prefPer=p=>(p.pref==="so_dia"||p.pref==="mais_dia")?"dia":(p.pref==="so_noite"||p.pref==="mais_noite")?"noite":null;
  const WF=0.18,WH=0.18,WT=0.04,WP=0.35,WM=0.01;const balFds=eq.balFds!==false,balFer=eq.balFer!==false; // fds e feriado: mesmo peso, contados separadamente
  const permitido=(p,code)=>!Array.isArray(p.turnos)||p.turnos.length===0||p.turnos.includes(code);
  for(let d=1;d<=dim;d++){const isH=hol.includes(d),isW=isWknd(y,m,d);
    const slots=[];for(const t of autoTurnos)for(const fn of eq.funcoes){
      const have=eq.profs.filter(p=>p.funcaoId===fn.id&&next[p.id][d]===t.code).length;
      const rem=req(d,t.code,fn.id)-have;if(rem>0)slots.push({t,fn,rem});}
    while(true){let best=null;
      for(const sl of slots){if(sl.rem<=0)continue;
        for(const p of eq.profs){
          if(p.funcaoId!==sl.fn.id||busy(p.id,d))continue;if(eq.restRule&&longPrev(p.id,d))continue;if(!permitido(p,sl.t.code))continue;
          if(p.pref==="so_dia"&&sl.t.periodo==="noite")continue;if(p.pref==="so_noite"&&sl.t.periodo==="dia")continue;
          const pp=prefPer(p);let s=hrs[p.id]/(tgt[p.id]||1)+(isH?(balFer?fer[p.id]*WH:0):isW?(balFds?fds[p.id]*WF:0):0)+(pp?0:(sl.t.periodo==="dia"?dia[p.id]:noi[p.id])*WT);
          if(pp&&pp!==sl.t.periodo)s+=WP;if(pp&&pp===sl.t.periodo)s-=WM;
          if(!best||s<best.s||(s===best.s&&hrs[p.id]<hrs[best.p.id]))best={p,sl,s};}}
      if(!best)break;
      const {p,sl}=best;next[p.id][d]=sl.t.code;hrs[p.id]+=sl.t.horas;sl.rem--;
      if(sl.t.periodo==="dia")dia[p.id]++;else noi[p.id]++;if(isH)fer[p.id]++;else if(isW)fds[p.id]++;}
  }
  eq.profs.forEach(p=>{for(let d=1;d<=dim;d++)if(!next[p.id][d])next[p.id][d]="F";});
  return next;
}

const NIVEIS=[{k:"pcm",nome:"Cuidado mínimo",h:4,enf:0.33},{k:"pci",nome:"Cuidado intermediário",h:6,enf:0.33},
  {k:"padc",nome:"Alta dependência",h:10,enf:0.37},{k:"pcsi",nome:"Semi-intensivo",h:10,enf:0.42},{k:"pcit",nome:"Intensivo",h:18,enf:0.52}];
function dimensionar(dm){let the=0,theEnf=0;NIVEIS.forEach(n=>{const p=+dm[n.k]||0;const h=p*n.h;the+=h;theEnf+=h*n.enf;});
  const theTec=the-theEnf;const ist=1+((+dm.ist||15)/100);const kmE=7/(+dm.jstEnf||36)*ist,kmT=7/(+dm.jstTec||36)*ist;
  return {the,theEnf,theTec,qpEnf:Math.ceil(kmE*theEnf),qpTec:Math.ceil(kmT*theTec),simEnf:Math.ceil(theEnf/24),simTec:Math.ceil(theTec/24)};}
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  return new Date(y,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1);}
function feriadosNacionais(y,opt){const out=[[0,1,"Confraternização"],[3,21,"Tiradentes"],[4,1,"Dia do Trabalho"],[8,7,"Independência"],[9,12,"N. Sra. Aparecida"],[10,2,"Finados"],[10,15,"Proclamação da República"],[10,20,"Consciência Negra"],[11,25,"Natal"]];
  const p=pascoa(y);const add=(off,n)=>{const d=new Date(p);d.setDate(p.getDate()+off);out.push([d.getMonth(),d.getDate(),n]);};
  add(-2,"Sexta-feira Santa");if(opt&&opt.carnaval){add(-48,"Carnaval (seg)");add(-47,"Carnaval (ter)");}if(opt&&opt.corpus)add(60,"Corpus Christi");
  return out;}
function avisosFerias(periodos){const w=[];const dias=periodos.map(p=>p.ini&&p.fim?Math.round((Date.parse(p.fim)-Date.parse(p.ini))/86400000)+1:0);
  if(periodos.length>3)w.push("mais de 3 períodos (CLT permite até 3)");if(dias.some(d=>d>0&&d<5))w.push("período com menos de 5 dias");
  if(dias.length&&Math.max(...dias)<14)w.push("nenhum período com 14 dias ou mais");const tot=dias.reduce((a,b)=>a+b,0);if(tot>30)w.push("total acima de 30 dias ("+tot+")");return w;}
function sobrepoe(a,b){return a.ini&&a.fim&&b.ini&&b.fim&&Date.parse(a.ini)<=Date.parse(b.fim)&&Date.parse(b.ini)<=Date.parse(a.fim);}
function validarTroca({sched,turnoMap,restRule,A,a,B,b,mesmaFuncao}){const e=[];if(!A||!B||A===B)return ["escolha duas pessoas diferentes"];
  const ta=(sched[A]||{})[a],tb=(sched[B]||{})[b];if(!turnoMap[ta])e.push("a pessoa 1 não tem plantão no dia "+a);if(!turnoMap[tb])e.push("a pessoa 2 não tem plantão no dia "+b);
  if(e.length)return e;if(!mesmaFuncao)e.push("funções diferentes — a cobertura por função vai mudar");
  const fb=(sched[B]||{})[a],fa=(sched[A]||{})[b];if(a!==b&&fb&&fb!=="F")e.push("a pessoa 2 não está livre no dia "+a+" ("+fb+")");if(a!==b&&fa&&fa!=="F")e.push("a pessoa 1 não está livre no dia "+b+" ("+fa+")");
  if(restRule){const n={};n[A]={...(sched[A]||{})};n[B]={...(sched[B]||{})};if(a===b){n[A][a]=tb;n[B][b]=ta;}else{n[B][a]=ta;n[A][a]="F";n[A][b]=tb;n[B][b]="F";}
    const longo=c=>c&&(turnoMap[c]||{}).horas>=12;[[A,n[A]],[B,n[B]]].forEach(([id,r])=>{[a,b].forEach(d=>{if(longo(r[d])&&(longo(r[d-1])||longo(r[d+1])))e.push("quebra a folga pós-12h de "+id+" perto do dia "+d);});});}
  return e;}

async function hashPin(salt,pin){const txt=salt+":"+String(pin);try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
  catch(e){let h=2166136261;for(const ch of txt){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return "f"+h.toString(16);}}
function aplicarTrocaEm(sc,A,a,B,b){const n={...sc};n[A]={...(n[A]||{})};n[B]={...(n[B]||{})};const ta=n[A][a],tb=n[B][b];
  if(a===b){n[A][a]=tb;n[B][b]=ta;}else{n[B][a]=ta;n[A][a]="F";n[A][b]=tb;n[B][b]="F";}return n;}

function SimTroca({eq,sched,turnoMap,sol,dim}){const pa=eq.profs.find(p=>p.id===sol.de),pb=eq.profs.find(p=>p.id===sol.para);if(!pa||!pb)return null;
  const depois=aplicarTrocaEm(sched,sol.de,sol.diaDe,sol.para,sol.diaPara);
  const erros=validarTroca({sched,turnoMap,restRule:eq.restRule,A:sol.de,a:sol.diaDe,B:sol.para,b:sol.diaPara,mesmaFuncao:pa.funcaoId===pb.funcaoId});
  const lo=Math.max(1,Math.min(sol.diaDe,sol.diaPara)-2),hi=Math.min(dim,Math.max(sol.diaDe,sol.diaPara)+2);const ds=[];for(let d=lo;d<=hi;d++)ds.push(d);
  const cls=c=>{const t=turnoMap[c];if(t)return t.periodo==="noite"?"k-noite":(t.horas>=12?"k-dia":"k-curto");return c==="F"?"k-F":c?"k-lic":"";};

          {linha(pa.nome,sc[sol.de]||{},ref?ref[sol.de]||{}:null)}{linha(pb.nome,sc[sol.para]||{},ref?ref[sol.para]||{}:null)}</tbody></table></div>)}</div>
    <div className="hint" style={{color:erros.length?"var(--warn)":"var(--ok)"}}>{erros.length?"⚠ "+erros.join(" · "):"✓ Cobertura mantida e descanso respeitado."}</div></div>;}

          {orig&&<BtnCap cap={verOriginal?"voltar à escala atual":"ver como foi publicada"}><button className={"btn"+(verOriginal?" primary":"")} onClick={()=>setVerOriginal(!verOriginal)}>{verOriginal?"Ver atual":"Ver original"}</button></BtnCap>}
          <span className="hint" style={{marginTop:0}}>{orig?(diferencas.length?diferencas.length+" célula(s) diferem da original":"atual igual à original"):"Publique antes de liberar aos profissionais — a original fica guardada e as trocas aparecem como diferenças."}</span></div>
        {orig&&diferencas.length>0&&<div className="hint" style={{marginTop:8}}>{diferencas.slice(0,20).map((x,i)=><span key={i} style={{marginRight:12}}>{x.nome} dia {x.d}: <b>{x.de}</b>→<b>{x.para}</b></span>)}{diferencas.length>20&&"…"}</div>}</div>
      {verOriginal&&orig&&<div className="banner" data-sec="escala">Você está vendo a ESCALA ORIGINAL publicada em {orig.em}. Os totais e a cobertura abaixo se referem à escala atual.</div>}
      <div className="grid-scroll print-show" data-sec="escala"><table className="sched"><thead><tr>{Array.from({length:dim},(_,i)=>i+1).map(d=><th key={d} className={hol.includes(d)?"hol":isWknd(ano,mes,d)?"wknd":""}><div className="dwd">{WD[wdOf(ano,mes,d)]}</div><div className="dnum">{d}</div></th>)}</tr></thead>
          <tbody><tr>{Array.from({length:dim},(_,i)=>i+1).map(d=>{const v=(sched[me.id]||{})[d]||"";return <td key={d} className={hol.includes(d)?"hol":isWknd(ano,mes,d)?"wknd":""}><div className={"chip "+cls(v)} style={{width:"100%",borderRadius:0,height:34}}>{v||"·"}</div></td>;})}</tr></tbody></table></div>
        <div className="legend">{eq.turnos.map(t=><span key={t.code}><i className={"chip "+cls(t.code)}>{t.code}</i>{t.nome} {t.horas}h</span>)}{S.licencas.map(l=><span key={l.code}><i className={"chip "+cls(l.code)}>{l.code}</i>{l.nome}</span>)}</div></div>
      <div className="panel"><h2>Solicitar troca de plantão</h2>
        <div className="row">
          <div className="field"><label>Meu dia</label><select value={meuDia} onChange={e=>setMeuDia(e.target.value)}><option value="">—</option>{diasCom(me.id).map(d=><option key={d} value={d}>{d} ({(sched[me.id]||{})[d]})</option>)}</select></div>
          <div className="field"><label>Colega</label><select value={colega} onChange={e=>{setColega(e.target.value);setDiaColega("");}} style={{minWidth:170}}><option value="">—</option>{eq.profs.filter(p=>p.id!==me.id).map(p=><option key={p.id} value={p.id}>{p.nome}{p.funcaoId!==me.funcaoId?" (outra função)":""}</option>)}</select></div>
          <div className="field"><label>Dia do colega</label><select value={diaColega} onChange={e=>setDiaColega(e.target.value)} disabled={!colega}><option value="">—</option>{colega&&diasCom(colega).map(d=><option key={d} value={d}>{d} ({(sched[colega]||{})[d]})</option>)}</select></div>
          <button className="btn primary" disabled={!meuDia||!colega||!diaColega} onClick={()=>{onSolicitar(me.id,+meuDia,colega,+diaColega);setMeuDia("");setColega("");setDiaColega("");}}>Enviar ao colega</button></div>
        {meuDia&&colega&&diaColega&&<SimTroca eq={eq} sched={sched} turnoMap={turnoMap} dim={dim} sol={{de:me.id,para:colega,diaDe:+meuDia,diaPara:+diaColega}}/>}
        <div className="hint">Fluxo: você propõe → o colega aceita no portal dele → o coordenador autoriza. Só então a escala muda.</div></div>
      {sols.some(x=>x.para===me.id&&x.status==="aguardando_colega")&&<div className="panel"><h2>Propostas para você</h2>
        {sols.filter(x=>x.para===me.id&&x.status==="aguardando_colega").map(x=>{const de=eq.profs.find(p=>p.id===x.de)||{};return <div key={x.id} className="group" style={{marginBottom:8}}>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}><b>{de.nome}</b> quer trocar: você trabalharia no dia <b>{x.diaDe}</b> ({(sched[x.de]||{})[x.diaDe]}) e ele(a) no seu dia <b>{x.diaPara}</b> ({(sched[me.id]||{})[x.diaPara]}).
            <span style={{flex:1}}></span><button className="btn primary sm" onClick={()=>onResponder(x.id,true)}>Aceitar</button><button className="btn ghost sm" onClick={()=>onResponder(x.id,false)}>Recusar</button></div>
          <SimTroca eq={eq} sched={sched} turnoMap={turnoMap} dim={dim} sol={x}/></div>;})}</div>}
      {sols.some(x=>x.de===me.id||x.para===me.id)&&<div className="panel"><h2>Minhas solicitações</h2>
        {sols.filter(x=>x.de===me.id||x.para===me.id).map(x=>{const o=eq.profs.find(p=>p.id===(x.de===me.id?x.para:x.de))||{};const ST={aguardando_colega:"aguardando o colega",aguardando_coordenador:"aceita — aguardando o coordenador",autorizada:"✓ autorizada",negada:"✗ negada pelo coordenador",recusada:"✗ recusada"};
          return <div key={x.id} className="hint" style={{marginTop:2}}>• {x.de===me.id?"Você":o.nome} dia {x.diaDe} ↔ {x.de===me.id?o.nome:"você"} dia {x.diaPara}: <b>{ST[x.status]}</b></div>;})}</div>}
    </>}
  </div>;}

function PainelDimensionamento({eq,onChange,onAplicar}){const dm=eq.dim||{};const r=dimensionar(dm);const inp={width:70,border:"1px solid var(--line)",borderRadius:7,padding:"5px 7px",textAlign:"center"};
  return <div className="panel noprint"><h2>Dimensionamento de pessoal · COFEN 543/2017 <span className="sp"></span><BtnCap cap="preenche quantos por turno"><button className="btn sm primary" onClick={onAplicar} disabled={!r.the}>Aplicar à cobertura</button></BtnCap></h2>
    <div className="row" style={{alignItems:"flex-start"}}>

        {NIVEIS.map(n=><tr key={n.k}><td>{n.nome}</td><td className="mono">{n.h}h</td><td className="mono">{Math.round(n.enf*100)}%</td><td><input style={inp} type="number" min="0" value={dm[n.k]||""} onChange={e=>onChange(n.k,+e.target.value||0)}/></td></tr>)}</tbody></table>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="row"><div className="field"><label>IST (%)</label><input style={inp} type="number" value={dm.ist??15} onChange={e=>onChange("ist",+e.target.value||0)}/></div>
          <div className="field"><label>Jornada enf. (h/sem)</label><input style={inp} type="number" value={dm.jstEnf||eq.defWeekly||36} onChange={e=>onChange("jstEnf",+e.target.value||0)}/></div>
          <div className="field"><label>Jornada téc. (h/sem)</label><input style={inp} type="number" value={dm.jstTec||eq.defWeekly||36} onChange={e=>onChange("jstTec",+e.target.value||0)}/></div></div>
        <div className="row">
          <div className="stat"><div className="k">Horas enf./dia (THE)</div><div className="v">{Math.round(r.the)}h</div></div>
          <div className="stat"><div className="k">Quadro enfermeiros</div><div className="v">{r.qpEnf}</div></div>
          <div className="stat"><div className="k">Quadro técnicos</div><div className="v">{r.qpTec}</div></div>
          <div className="stat" style={{borderColor:"var(--teal)"}}><div className="k">Presentes por turno · enf</div><div className="v">{r.simEnf}</div></div>
          <div className="stat" style={{borderColor:"var(--teal)"}}><div className="k">Presentes por turno · téc</div><div className="v">{r.simTec}</div></div></div>
        <div className="hint">Quadro = KM × THE, com KM = (7 ÷ jornada semanal) × (1 + IST). "Presentes por turno" = horas da categoria ÷ 24 — é o que vai para a cobertura. A resolução ainda exige mínimo de 6 enfermeiros em unidades de cuidado mínimo/intermediário.</div>
      </div></div></div>;}

function PainelFerias({eq,ano,onAdd,onUpd,onRm,onAplicar}){const meses=["J","F","M","A","M","J","J","A","S","O","N","D"];const inp={border:"1px solid var(--line)",borderRadius:7,padding:"4px 6px"};
  const noMes=(per,m)=>per.some(x=>x.ini&&x.fim&&Date.parse(x.ini)<=new Date(ano,m+1,0).getTime()&&Date.parse(x.fim)>=new Date(ano,m,1).getTime());
  const conflitos=[];eq.funcoes.forEach(f=>{const ps=eq.profs.filter(p=>p.funcaoId===f.id);for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)(ps[i].ferias||[]).forEach(a=>(ps[j].ferias||[]).forEach(b=>{if(sobrepoe(a,b))conflitos.push(`${ps[i].nome} e ${ps[j].nome} (${f.nome}) coincidem entre ${b.ini>a.ini?b.ini:a.ini} e ${a.fim<b.fim?a.fim:b.fim}`);}));});
  return <div className="panel noprint"><h2>Planejamento anual de férias · {ano} <span className="sp"></span><BtnCap cap="grava FE nos meses planejados"><button className="btn sm primary" onClick={onAplicar}>Aplicar às escalas do ano</button></BtnCap></h2>
    {eq.profs.length===0?<div className="empty" style={{padding:"6px 0"}}>Cadastre a equipe.</div>:
    <table className="tb"><thead><tr><th>Profissional</th>{meses.map((m,i)=><th key={i} style={{textAlign:"center",width:26}}>{m}</th>)}<th>Períodos</th></tr></thead><tbody>
      {eq.profs.map(p=>{const per=p.ferias||[];const av=avisosFerias(per);return <tr key={p.id}><td style={{whiteSpace:"nowrap"}}><b>{p.nome}</b>{av.length>0&&<div className="hint" style={{marginTop:2,color:"var(--warn)"}}>⚠ {av.join("; ")}</div>}</td>
        {meses.map((_,m)=><td key={m} style={{textAlign:"center"}}>{noMes(per,m)?<span className="chip k-FE">FE</span>:""}</td>)}
        <td>{per.map((x,i)=><div key={i} style={{display:"flex",gap:4,marginBottom:3,alignItems:"center"}}><input style={inp} type="date" value={x.ini||""} onChange={e=>onUpd(p.id,i,"ini",e.target.value)}/><span>→</span><input style={inp} type="date" value={x.fim||""} onChange={e=>onUpd(p.id,i,"fim",e.target.value)}/>
          <span className="mono" style={{fontSize:11,color:"var(--muted)"}}>{x.ini&&x.fim?Math.round((Date.parse(x.fim)-Date.parse(x.ini))/86400000)+1+"d":""}</span><button className="btn ghost sm" onClick={()=>onRm(p.id,i)}>×</button></div>)}
          <button className="btn sm" onClick={()=>onAdd(p.id)}>+ período</button></td></tr>;})}</tbody></table>}
    {conflitos.length>0&&<div className="adv-list" style={{marginTop:10}}>{conflitos.map((c,i)=><div className="adv adv-warn" key={i}><span className="adv-ic">⚠</span><span>{c}</span></div>)}</div>}
    <div className="hint">Regras CLT: até 3 períodos, um deles com 14+ dias, nenhum menor que 5. "Aplicar" grava FE nos dias planejados das escalas deste ano (preservado pelo gerador).</div></div>;}

function PainelTroca({eq,sched,turnoMap,dim,onTrocar,log}){const [A,setA]=useState("");const [a,setA2]=useState(1);const [B,setB]=useState("");const [b,setB2]=useState(1);
  const fA=eq.profs.find(p=>p.id===A),fB=eq.profs.find(p=>p.id===B);const mesma=fA&&fB&&fA.funcaoId===fB.funcaoId;
  const erros=A&&B?validarTroca({sched,turnoMap,restRule:eq.restRule,A,a,B,b,mesmaFuncao:!!mesma}):[];
  return <div className="panel noprint"><h2>Troca de plantão</h2>
    <div className="row">
      <div className="field"><label>Pessoa 1</label><select value={A} onChange={e=>setA(e.target.value)}><option value="">—</option>{eq.profs.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select></div>
      <div className="field"><label>cede o dia</label><input type="number" min="1" max={dim} value={a} onChange={e=>setA2(+e.target.value||1)}/></div>
      <div className="field"><label>Pessoa 2</label><select value={B} onChange={e=>setB(e.target.value)}><option value="">—</option>{eq.profs.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select></div>
      <div className="field"><label>cede o dia</label><input type="number" min="1" max={dim} value={b} onChange={e=>setB2(+e.target.value||1)}/></div>
      <button className="btn primary" disabled={!A||!B||erros.some(x=>!x.startsWith("funções"))} onClick={()=>onTrocar(A,a,B,b,erros)}>Trocar</button></div>
    {A&&B&&<div className="hint" style={{color:erros.length?"var(--warn)":"var(--ok)"}}>{erros.length?"⚠ "+erros.join(" · "):"✓ Troca válida: cobertura mantida, descanso respeitado."}</div>}
    {log.length>0&&<div style={{marginTop:10}}><div className="field"><label>Registro de trocas do mês</label></div>{log.map((t,i)=><div key={i} className="hint" style={{marginTop:2}}>• {t.em}: {t.de} cedeu dia {t.diaDe} ({t.tDe}) ↔ {t.para} cedeu dia {t.diaPara} ({t.tPara})</div>)}</div>}
  </div>;}

function Landing({onEntrar,onCriar,onReset,onPortal,erro,info,busy}){const [email,setEmail]=useState("");const [senha,setSenha]=useState("");const [n,setN]=useState(1);const [per,setPer]=useState(6);const [modo,setModo]=useState("entrar");
  return <div className="land">
    <div className="hero"><div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}><img src="icon-192.png" alt="" style={{width:44,height:44,borderRadius:10,background:"#fff"}} onError={e=>e.currentTarget.style.display="none"}/><span style={{fontFamily:"'Space Grotesk'",fontWeight:700,fontSize:20}}>Coordenador</span></div>
      <h1>Escalas e gestão da equipe, no celular.</h1><p>Gere a escala do mês em segundos com cobertura, descanso e fins de semana equilibrados. Sua equipe vê a própria escala e pede trocas pelo celular — você só autoriza.</p><p style={{opacity:.85,fontSize:13}}>Dimensionamento COFEN · banco de horas · férias · documentos do conselho · indicadores para a diretoria.</p></div>
    <div className="two">
      <div className="panel"><h2>Contrate aqui</h2>
        <div className="row" style={{marginBottom:10}}><div className="field"><label>Escalas (setores)</label><select value={n} onChange={e=>setN(+e.target.value)}>{PLANOS.map(p=><option key={p.n} value={p.n}>{p.n} escala{p.n>1?"s":""}</option>)}</select></div>
          <div className="field"><label>Período</label><div className="seg"><button className={per===6?"on":""} onClick={()=>setPer(6)}>Semestral</button><button className={per===12?"on":""} onClick={()=>setPer(12)}>Anual</button></div></div></div>
        <div className="price">{fmtR(PRECO(n,per))}</div><div className="hint" style={{marginTop:2}}>{per===12?"por ano · 2 meses grátis":"por semestre · 1 mês grátis"} · Pix · equivale a {fmtR(PRECO(n,per)/per)}/mês</div>
        <div className="hint">1 escala = 1 setor com escala mensal própria. Teste grátis por 14 dias ao criar a conta; o pagamento é feito dentro da plataforma.</div>
        <button className="btn primary" style={{marginTop:10}} onClick={()=>setModo("criar")}>Criar conta e começar o teste grátis</button></div>
      <div className="panel auth"><h2>{modo==="criar"?"Criar conta de coordenador":modo==="reset"?"Recuperar senha":"Entrar (coordenador)"}</h2>
        <input type="email" placeholder="seu@email.com" value={email} onChange={e=>setEmail(e.target.value)} autoComplete="email"/>
        {modo!=="reset"&&<input type="password" placeholder="senha (mín. 6 caracteres)" value={senha} onChange={e=>setSenha(e.target.value)} autoComplete={modo==="criar"?"new-password":"current-password"} onKeyDown={e=>e.key==="Enter"&&(modo==="criar"?onCriar(email,senha):onEntrar(email,senha))}/>}
        {erro&&<div className="hint" style={{color:"var(--bad)",marginBottom:6}}>{erro}</div>}{info&&<div className="hint" style={{color:"var(--ok)",marginBottom:6}}>{info}</div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {modo==="entrar"&&<button className="btn primary" disabled={busy} onClick={()=>onEntrar(email,senha)}>Entrar</button>}
          {modo==="criar"&&<button className="btn primary" disabled={busy} onClick={()=>onCriar(email,senha)}>Criar conta</button>}
          {modo==="reset"&&<button className="btn primary" disabled={busy} onClick={()=>onReset(email)}>Enviar link</button>}
          <button className="btn" onClick={()=>setModo(modo==="entrar"?"criar":"entrar")}>{modo==="entrar"?"Criar conta":"Já tenho conta"}</button>
          <button className="btn ghost" onClick={()=>setModo("reset")}>Esqueci a senha</button></div>
        <div style={{marginTop:16,borderTop:"1px solid var(--line)",paddingTop:12}}><div className="hint" style={{marginTop:0,marginBottom:6}}>É da equipe (técnico, enfermeiro…)? Entre com o código do setor e seu PIN.</div>
          <button className="btn" onClick={onPortal}>👤 Sou profissional da equipe</button></div></div></div>
    <div className="hint" style={{textAlign:"center",marginTop:14}}>No celular: use "Adicionar à tela de início" (Safari: Compartilhar · Chrome: menu ⋮) para abrir como app.</div>
  </div>;}

function PortalOnline({onVoltar}){const [codigo,setCodigo]=useState(localStorage.getItem("coord_codigo")||"");const [setor,setSetor]=useState(null);const [prof,setProf]=useState("");const [pin,setPin]=useState("");
  const [token,setToken]=useState(localStorage.getItem("coord_portal_token")||"");const [me,setMe]=useState(null);const [erro,setErro]=useState("");const [busy,setBusy]=useState(false);
  const [ym,setYm]=useState(null);const [sol,setSol]=useState({dia:"",colega:"",diaC:""});
  const api=async(path,opt)=>{const r=await fetch(WORKER_URL+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"erro "+r.status);return j;};
  const carregar=async(t,y)=>{try{setBusy(true);const j=await api("/portal/me?token="+encodeURIComponent(t)+(y?"&ym="+y:""));setMe(j);setYm(j.ym);setErro("");}catch(e){setMe(null);setToken("");localStorage.removeItem("coord_portal_token");setErro(e.message);}finally{setBusy(false);}};
  useEffect(()=>{if(token)carregar(token,null);},[]);
  const buscarSetor=async()=>{try{setBusy(true);setErro("");const j=await api("/portal/setor?codigo="+encodeURIComponent(codigo.trim()));setSetor(j);localStorage.setItem("coord_codigo",codigo.trim().toUpperCase());}catch(e){setErro(e.message);}finally{setBusy(false);}};
  const entrar=async()=>{try{setBusy(true);setErro("");const j=await api("/portal/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({codigo:codigo.trim(),prof_id:prof,pin})});localStorage.setItem("coord_portal_token",j.token);setToken(j.token);setPin("");await carregar(j.token,null);}catch(e){setErro(e.message);}finally{setBusy(false);}};
  const sair=async()=>{try{await api("/portal/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});}catch(e){}localStorage.removeItem("coord_portal_token");setToken("");setMe(null);};
  const solicitar=async()=>{try{setBusy(true);await api("/portal/solicitar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,ym,dia_de:+sol.dia,para:sol.colega,dia_para:+sol.diaC})});setSol({dia:"",colega:"",diaC:""});await carregar(token,ym);}catch(e){setErro(e.message);}finally{setBusy(false);}};
  const responder=async(id,aceita)=>{try{await api("/portal/responder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,id,aceita})});await carregar(token,ym);}catch(e){setErro(e.message);}};
  const lido=async(id)=>{try{await api("/portal/lido",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,id})});await carregar(token,ym);}catch(e){setErro(e.message);}};
  if(!WORKER_URL)return <div className="land"><div className="panel"><h2>Portal indisponível</h2><div className="hint">O endereço do Worker não está configurado neste app.</div><button className="btn" onClick={onVoltar}>← Voltar</button></div></div>;
  if(!me)return <div className="land"><div className="panel auth" style={{maxWidth:460,margin:"0 auto"}}><h2>Portal do profissional</h2>
      {!setor?<><div className="field"><label>Código do setor (peça ao coordenador)</label><input placeholder="ex.: UTI-7K3P" value={codigo} onChange={e=>setCodigo(e.target.value.toUpperCase())} onKeyDown={e=>e.key==="Enter"&&buscarSetor()} style={{textTransform:"uppercase",letterSpacing:2}}/></div>
          <button className="btn primary" disabled={busy||!codigo.trim()} onClick={buscarSetor}>Continuar</button></>
      :<><div className="hint" style={{marginTop:0}}>{setor.org} · <b>{setor.setor}</b> <button className="btn ghost sm" onClick={()=>setSetor(null)}>trocar</button></div>
          <div className="field" style={{marginTop:8}}><label>Seu nome</label><select value={prof} onChange={e=>setProf(e.target.value)} style={{width:"100%",padding:11,fontSize:15,border:"1px solid var(--line)",borderRadius:9,marginBottom:8}}><option value="">—</option>{setor.profs.map(p=><option key={p.id} value={p.id}>{p.nome}{p.temPin?"":" (sem PIN)"}</option>)}</select></div>
          <div className="field"><label>PIN (4 dígitos)</label><input type="password" inputMode="numeric" maxLength={4} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,"").slice(0,4))} onKeyDown={e=>e.key==="Enter"&&entrar()} style={{letterSpacing:8,textAlign:"center",fontSize:20}}/></div>
          <button className="btn primary" disabled={busy||!prof||pin.length!==4} onClick={entrar}>Entrar</button></>}
      {erro&&<div className="hint" style={{color:"var(--bad)"}}>{erro}</div>}
      <div style={{marginTop:14}}><button className="btn ghost sm" onClick={onVoltar}>← Sou coordenador</button></div></div></div>;
  // ----- logado -----

function FuncSelect({funcoes,value,onSelect,onCreate}){const [novo,setNovo]=useState(false);const [txt,setTxt]=useState("");
  const ok=()=>{if(txt.trim())onCreate(txt);setNovo(false);setTxt("");};
  if(novo)return <div style={{display:"flex",gap:4}}><input autoFocus placeholder="Digite a função" value={txt} onChange={e=>setTxt(e.target.value)}
    onKeyDown={e=>{if(e.key==="Enter")ok();if(e.key==="Escape"){setNovo(false);setTxt("");}}} style={{minWidth:140,border:"1px solid var(--teal)",borderRadius:7,padding:"5px 8px"}}/>
    <button className="btn sm primary" onClick={ok}>ok</button></div>;
  return <select value={value||""} onChange={e=>{if(e.target.value==="__outra__")setNovo(true);else onSelect(e.target.value);}}>
    {funcoes.map(f=><option key={f.id} value={f.id}>{f.nome}</option>)}<option value="__outra__">＋ Outra função… (digitar)</option></select>;}

  const advice=useMemo(()=>{const out=[];if(eq.profs.length===0)return out;
    const short=[];for(let d=1;d<=dim;d++)for(const t of autoTurnos)for(const f of eq.funcoes){const miss=req(d,t.code,f.id)-((coverage[d][t.code]||{})[f.id]||0);if(miss>0)short.push({d,t,f,miss});}
    if(short.length===0)out.push({sev:"ok",text:`Cobertura mínima atendida em todos os ${dim} dias.`});
    else{const shown=short.slice(0,4).map(s=>`dia ${s.d} (${WD[wdOf(ano,mes,s.d)]}): falta${s.miss>1?"m":""} ${s.miss} ${s.f.nome} no ${s.t.code}`);
      out.push({sev:"crit",text:`Faltam profissionais em ${new Set(short.map(s=>s.d)).size} dia(s) — ${shown.join("; ")}${short.length>4?`; e mais ${short.length-4} lacuna(s)`:""}.`});
      out.push({sev:"info",text:"O que fazer: escalar mais gente nesses dias, cadastrar profissionais, ou reduzir a exigência de cobertura."});}
    const maxShifts=eq.restRule?Math.floor((dim+1)/2):dim;
    eq.funcoes.forEach(f=>{let demand=0;for(let d=1;d<=dim;d++)autoTurnos.forEach(t=>demand+=req(d,t.code,f.id));
      const n=eq.profs.filter(p=>p.funcaoId===f.id).length,supply=n*maxShifts;
      if(n===0&&demand>0){out.push({sev:"crit",text:`Nenhum(a) ${f.nome} cadastrado(a), mas a cobertura exige ${demand} plantões dessa função no mês.`});return;}
      if(demand>supply)out.push({sev:"warn",text:`${f.nome}: exigência de ${demand} plantões/mês acima da capacidade (~${supply}). Faltam ~${demand-supply} — contratar ${Math.ceil((demand-supply)/maxShifts)} ou reduzir cobertura.`});});
    ["noite","dia"].forEach(per=>{eq.funcoes.forEach(f=>{const ts=autoTurnos.filter(t=>t.periodo===per);if(!ts.length)return;
      let dem=false;for(let d=1;d<=dim&&!dem;d++)ts.forEach(t=>{if(req(d,t.code,f.id)>0)dem=true;});if(!dem)return;
      const able=eq.profs.filter(p=>p.funcaoId===f.id&&p.pref!==(per==="noite"?"so_dia":"so_noite")).length;
      if(able===0)out.push({sev:"crit",text:`O ${per==="noite"?"noturno":"diurno"} exige ${f.nome}, mas ninguém dessa função pode fazer ${per} (todos "só ${per==="noite"?"diurno":"noturno"}").`});});});
    const over=eq.profs.filter(p=>(totais[p.id]||0)-alvo(p)>=24),underT=eq.profs.filter(p=>alvo(p)-(totais[p.id]||0)>=24);
    if(over.length)out.push({sev:"warn",text:`Acima do alvo (+24h ou mais): ${over.map(p=>p.nome).join(", ")} — redistribua plantões.`});
    if(underT.length)out.push({sev:"info",text:`Abaixo do alvo (−24h ou mais): ${underT.map(p=>p.nome).join(", ")} — podem assumir mais plantões.`});
    if(!over.length&&!underT.length&&eq.profs.some(p=>totais[p.id]))out.push({sev:"ok",text:"Cargas dentro de ±24h do alvo para toda a equipe."});
    if(eq.profs.some(p=>totais[p.id]))eq.funcoes.forEach(f=>{const ps=eq.profs.filter(p=>p.funcaoId===f.id);if(ps.length<2)return;
      const v=ps.map(p=>fdsCount[p.id]||0),mn=Math.min(...v),mx=Math.max(...v);
      if(mx-mn<=1)out.push({sev:"ok",text:`${f.nome}: fins de semana/feriados bem distribuídos (${mn}–${mx} por pessoa).`});
      else out.push({sev:"warn",text:`${f.nome}: fins de semana desiguais (${mn}–${mx}). ${ps.filter(p=>fdsCount[p.id]===mx).map(p=>p.nome).join(", ")} trabalha(m) mais; ${ps.filter(p=>fdsCount[p.id]===mn).map(p=>p.nome).join(", ")} menos. Troque um plantão de fim de semana entre eles.`});});
    return out;},[eq,sched,coverage,dim,ano,mes,totais,fdsCount,hol]);

  // ---------- exportações ----------
  function exportExcel(){const wb=XLSX.utils.book_new();const head=["Profissional","Função","Carga sem.","Preferência"];
    for(let d=1;d<=dim;d++)head.push(d+WD[wdOf(ano,mes,d)]+(isHol(d)?"*":""));head.push("Total","Alvo","Δ","FdS","Banco");
    const aoa=[[S.org.nome+" — "+eq.nome],["Escala — "+MESES[mes]+"/"+ano+(hol.length?"  ·  Feriados: "+hol.join(", ")+" (*)":"")],[],head];
    eq.profs.forEach(p=>{const f=eq.funcoes.find(x=>x.id===p.funcaoId);const row=[p.nome,f?f.nome:"",p.weekly+"h",PREFS[p.pref]||""];const r=sched[p.id]||{};
      for(let d=1;d<=dim;d++)row.push(r[d]||"");const h=totais[p.id]||0,t=alvo(p);row.push(h,t,h-t,fdsCount[p.id]||0,banco[p.id]||0);aoa.push(row);});
    aoa.push([]);autoTurnos.forEach(t=>eq.funcoes.forEach(f=>{const r=[t.code+" "+f.nome,"sem "+(((eq.cover.semana||{})[t.code]||{})[f.id]||0),"fds "+(((eq.cover.fds||{})[t.code]||{})[f.id]||0),""];
      for(let d=1;d<=dim;d++)r.push((coverage[d][t.code]||{})[f.id]||0);aoa.push(r);}));
    aoa.push([]);aoa.push(["Legenda"]);eq.turnos.forEach(t=>aoa.push([t.code,t.nome,t.horas+"h"]));S.licencas.forEach(l=>aoa.push([l.code,l.nome,"0h"]));
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=[{wch:22},{wch:14},{wch:9},{wch:16},...Array(dim).fill({wch:4}),{wch:6},{wch:6},{wch:5},{wch:5},{wch:6}];
    XLSX.utils.book_append_sheet(wb,ws,"Escala");
    if(orig){const ao=[[S.org.nome+" — "+eq.nome+" — ORIGINAL publicada em "+orig.em],[],["Profissional",...days.map(d=>d+WD[wdOf(ano,mes,d)])]];eq.profs.forEach(p=>{const rr=[p.nome];for(let d=1;d<=dim;d++)rr.push((orig.sched[p.id]||{})[d]||"");ao.push(rr);});
      if(diferencas.length){ao.push([]);ao.push(["Diferenças (original → atual)"]);diferencas.forEach(x=>ao.push([x.nome,"dia "+x.d,x.de+" → "+x.para]));}
      const wo=XLSX.utils.aoa_to_sheet(ao);wo["!cols"]=[{wch:22},...Array(dim).fill({wch:4})];XLSX.utils.book_append_sheet(wb,wo,"Original");}
    XLSX.writeFile(wb,"escala-"+eq.nome.toLowerCase().replace(/\s+/g,"-")+"-"+MESES[mes].toLowerCase()+"-"+ano+".xlsx");}
  function exportJSON(){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="coordenador-backup.json";a.click();}
  useEffect(()=>{const li=document.getElementById("logoInput"),ji=document.getElementById("jsonInput");

  async function pagar(n,periodo){if(!PAY_ENDPOINT){alert(`${n} escala(s) · ${periodo===12?"anual":"semestral"}: ${fmtR(PRECO(n,periodo))}.\nPagamento Pix será ativado quando o Worker estiver configurado.`);return;}
    if(!sb||!user){alert("Entre com sua conta antes de pagar.");return;}
    try{const {data}=await sb.auth.getSession();const tok=data.session?.access_token;
      const r=await fetch(PAY_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:JSON.stringify({plano:n,periodo})});
      const j=await r.json();if(j.ticket_url){window.open(j.ticket_url,"_blank");let k=0;const t=setInterval(()=>{k++;recarregarPlano();if(k>30)clearInterval(t);},20000);}else alert("Não foi possível iniciar o pagamento: "+(j.error||"erro"));}catch(e){alert("Erro ao iniciar pagamento.");}}

  const badge=S.plano.status==="demo"?<span className="badge demo">○ Demo · 1 escala</span>:liberado?<span className="badge live">● {S.plano.limite} escala(s){S.plano.vigenteAte?" até "+new Date(S.plano.vigenteAte).toLocaleDateString("pt-BR"):""}</span>:<span className="badge lock">⚠ Plano vencido</span>;
  const docsTabela=useMemo(()=>{const hoje=new Date();hoje.setHours(0,0,0,0);const st=v=>{if(!v)return ["—",""];const d=Math.round((Date.parse(v)-hoje.getTime())/86400000);if(isNaN(d))return ["—",""];const dt=new Date(v+"T00:00:00").toLocaleDateString("pt-BR");return d<0?[dt+" (vencido)","bad"]:d<=30?[dt+" ("+d+"d)","warn"]:[dt,"ok"];};
    const rows=[];S.equipes.forEach(e=>e.profs.forEach(p=>{const ds=p.dossie||{};const f=e.funcoes.find(x=>x.id===p.funcaoId);
      rows.push({setor:e.nome,nome:p.nome,funcao:f?f.nome:"",coren:ds.coren||"—",anuidade:st(ds.corenVal),nada:st(ds.nadaConstaVal),aso:st(ds.asoVal),certs:(ds.certs||[]).map(c=>[c.nome||"?",st(c.val)]),pin:!!ds.pinHash});}));return rows;},[S.equipes]);
  const vencimentos=useMemo(()=>{const hoje=new Date();hoje.setHours(0,0,0,0);const out=[];

      if(d<0)out.push({sev:"crit",dias:d,text:`${pNome} (${eqNome}): ${label} VENCIDO há ${Math.abs(Math.round(d))} dia(s).`});
      else if(d<=30)out.push({sev:"warn",dias:d,text:`${pNome} (${eqNome}): ${label} vence em ${Math.round(d)} dia(s).`});};
    S.equipes.forEach(e=>e.profs.forEach(p=>{const ds=p.dossie||{};
      chk(e.nome,p.nome,"anuidade do conselho",ds.corenVal);chk(e.nome,p.nome,"nada consta do conselho",ds.nadaConstaVal);

  const banco=useMemo(()=>{const o={};eq.profs.forEach(p=>{let saldo=+((p.dossie||{}).saldoInicial)||0;
    Object.keys(eq.sched||{}).forEach(k=>{const [yy,mm]=k.split("-").map(Number);if(yy>ano||(yy===ano&&mm>mes))return;const r=(eq.sched[k]||{})[p.id]||{};if(!Object.keys(r).length)return;
      const dK=daysInMonth(yy,mm);const hK=(eq.holidayMap||{})[k]||[];let dc=0;for(let d=1;d<=dK;d++){const w=wdOf(yy,mm,d);const off=(eq.diasSemana||6)>=6?w===0:(w===0||w===6);if(!off&&!hK.includes(d))dc++;}
      const alvoK=Math.round((p.weekly||0)/(eq.diasSemana||6)*dc);let h=0;for(const d in r)h+=hDe(r[d]);saldo+=h-alvoK;});o[p.id]=saldo;});return o;},[eq,ano,mes,turnoMap]);
  const indic=useMemo(()=>{const n=eq.profs.length;if(!n)return null;let lic=0,fe=0,extra=0,slots=0,okSlots=0;

    const fv=eq.profs.map(p=>fdsCount[p.id]||0);const porFuncao=eq.funcoes.map(f=>({nome:f.nome,n:eq.profs.filter(p=>p.funcaoId===f.id).length}));
    return {abs:(lic/(n*dim)*100),ferias:(fe/(n*dim)*100),extra,cob:slots?okSlots/slots*100:100,fdsMin:Math.min(...fv),fdsMax:Math.max(...fv),fdsMed:fv.reduce((a,b)=>a+b,0)/n,porFuncao,bancoTot:eq.profs.reduce((a,p)=>a+(banco[p.id]||0),0)};},[eq,sched,dim,totais,coverage,fdsCount,banco]);

  const maxH=Math.max(1,...eq.profs.map(p=>Math.max(alvo(p),totais[p.id]||0)));

  const NAV=[["panorama","🏠 Panorama",0],["escala","📅 Escala",diasDescobertos],["trocas","🔁 Trocas",pendTrocas],["equipe","👥 Equipe",0],["setor","⚙️ Setor",0],["docs","📄 Documentos",vencimentos.length],["indic","📊 Indicadores",0]];

      {!liberado&&<div className="lock noprint"><div className="modal" style={{maxWidth:640}}>

        {S.equipes.map(e=><button key={e.id} className={"tab"+(e.id===S.ativa?" on":"")} onClick={()=>upd(s=>({...s,ativa:e.id}))} onDoubleClick={()=>{const n=prompt("Nome do setor:",e.nome);if(n&&n.trim())upd(s=>({...s,equipes:s.equipes.map(x=>x.id===e.id?{...x,nome:n.trim()}:x)}));}} title="Duplo clique para renomear">{e.nome}</button>)}
        <input value={newEq} placeholder="Novo setor (ex.: UTI Adulto)" onChange={e=>setNewEq(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addEquipe()} style={{border:"1px solid var(--line)",borderRadius:999,padding:"7px 12px",fontSize:13}}/>
        <button className="btn sm" onClick={addEquipe}>+ setor</button>
        {S.equipes.length>1&&<button className="btn ghost sm" onClick={()=>rmEquipe(eq.id)}>remover atual</button>}
        <span className="hint" style={{marginTop:0,marginLeft:"auto"}}>{S.equipes.length}/{S.plano.limite} escala(s) no plano</span>
      </div>

      <div className="panel noprint" data-sec="escala">
        <h2>Período · carga horária · feriados <span className="sp"></span><span style={{textTransform:"none",letterSpacing:0,fontWeight:500}}>Nome do setor:</span>
          <input value={eq.nome} onChange={e=>updEq(x=>({...x,nome:e.target.value}))} style={{border:"1px solid var(--line)",borderRadius:8,padding:"5px 9px",fontWeight:600,fontSize:13,minWidth:200}} placeholder="ex.: UTI Adulto, Clínica Médica, Recepção"/></h2>
        <div className="row">
          <button className="navbtn" onClick={()=>mudarMes(-1)}>‹</button><div className="mlabel">{MESES[mes]} {ano}</div><button className="navbtn" onClick={()=>mudarMes(1)}>›</button>
          <div className="field"><label>Dias trab./semana</label><select value={eq.diasSemana||6} onChange={e=>updEq(x=>({...x,diasSemana:+e.target.value}))}><option value={6}>6 (só domingo folga)</option><option value={5}>5 (seg a sex)</option></select></div>
          <div className="field"><label>Carga padrão (novos)</label><input type="number" value={eq.defWeekly||36} onChange={e=>updEq(x=>({...x,defWeekly:+e.target.value||0}))}/></div>
          <label className="toggle"><input type="checkbox" checked={!!eq.restRule} onChange={e=>updEq(x=>({...x,restRule:e.target.checked}))}/> Folga após turno ≥12h</label>
          <label className="toggle"><input type="checkbox" checked={eq.balFds!==false} onChange={e=>updEq(x=>({...x,balFds:e.target.checked}))}/> Equilibrar fins de semana</label>
          <label className="toggle"><input type="checkbox" checked={eq.balFer!==false} onChange={e=>updEq(x=>({...x,balFer:e.target.checked}))}/> Equilibrar feriados</label>
          <div className="stat"><div className="k">Dias no mês</div><div className="v">{dim}</div></div>
          <div className="stat"><div className="k">Dias contados</div><div className="v">{diasContados}</div></div>
          <div className="field"><label>Feriados nacionais {ano}</label><div style={{display:"flex",gap:8,alignItems:"center"}}><BtnCap cap="marca os feriados oficiais"><button className="btn sm" onClick={carregarFeriados}>Carregar no ano</button></BtnCap>
            <label className="toggle" style={{fontSize:12}}><input type="checkbox" checked={ferOpt.carnaval} onChange={e=>setFerOpt({...ferOpt,carnaval:e.target.checked})}/>Carnaval</label>
            <label className="toggle" style={{fontSize:12}}><input type="checkbox" checked={ferOpt.corpus} onChange={e=>setFerOpt({...ferOpt,corpus:e.target.checked})}/>Corpus Christi</label></div></div>
          <div className="field"><label>Feriado local (dia)</label><div style={{display:"flex",gap:6}}><input type="number" min="1" max={dim} value={holIn} onChange={e=>setHolIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol()}/><button className="btn sm" onClick={addHol}>+</button></div></div>
        </div>
        {hol.length>0&&<div className="chips">{hol.map(d=><span className="chipx" key={d}>{d}/{mes+1}<button onClick={()=>rmHol(d)}>×</button></span>)}</div>}
        <div className="hint">Alvo mensal por pessoa = (carga semanal ÷ {eq.diasSemana||6}) × dias contados ({diasContados}). Cada feriado marcado desconta um dia. Feriados usam a cobertura de fim de semana.</div>
      </div>

      <div className="panel noprint" data-sec="setor"><h2>Turnos de trabalho <span className="sp"></span><button className="btn sm" onClick={addTurno}>+ turno</button></h2>
        <table className="tb"><thead><tr><th>Código</th><th>Nome</th><th>Horas</th><th>Período</th><th>Preenchimento automático</th><th></th></tr></thead><tbody>
          {eq.turnos.map((t,i)=><tr key={i}>
            <td><input className="code" value={t.code} onChange={e=>updTurno(i,"code",e.target.value.toUpperCase().replace(/\s/g,"").slice(0,4))}/></td>
            <td><input className="nm" value={t.nome} onChange={e=>updTurno(i,"nome",e.target.value)}/></td>
            <td><input className="sm" type="number" value={t.horas} onChange={e=>updTurno(i,"horas",+e.target.value||0)}/></td>
            <td><select value={t.periodo} onChange={e=>updTurno(i,"periodo",e.target.value)}><option value="dia">Diurno</option><option value="noite">Noturno</option></select></td>
            <td><label className="toggle"><input type="checkbox" checked={!!t.auto} onChange={e=>updTurno(i,"auto",e.target.checked)}/> gerador preenche este turno</label></td>
            <td><button className="btn ghost sm" onClick={()=>rmTurno(i)}>remover</button></td></tr>)}</tbody></table>
        <div className="hint">Com "gerador preenche" marcado, o turno aparece na cobertura e você diz quantas pessoas por dia; cobertura 0 = ninguém é escalado automaticamente (você pode colocar à mão). Desmarcado, o turno é só manual.</div></div>

      <div className="panel noprint" data-sec="setor"><h2>Funções e cobertura exigida <span className="sp"></span><button className="btn sm" onClick={addFunc}>+ função</button></h2>
        <div className="row" style={{alignItems:"flex-start"}}>
          <div style={{minWidth:220}}>{eq.funcoes.map((f,i)=><div key={f.id} style={{display:"flex",gap:6,marginBottom:6}}><input value={f.nome} onChange={e=>updFunc(i,e.target.value)} style={{flex:1,border:"1px solid var(--line)",borderRadius:7,padding:"5px 8px"}}/><button className="btn ghost sm" onClick={()=>rmFunc(i)}>×</button></div>)}</div>
          {[["semana","Dias de semana",""],["fds","Fim de semana / feriado","hl"]].map(([dt,lbl,cls])=><div className={"group "+cls} key={dt}><div className="glab">{lbl}</div>
            <table className="cov"><thead><tr><th>Turno</th>{eq.funcoes.map(f=><th key={f.id}>{f.nome}</th>)}</tr></thead><tbody>
              {autoTurnos.map(t=><tr key={t.code}><td className="mono" style={{fontWeight:700}}>{t.code}</td>{eq.funcoes.map(f=><td key={f.id}><input type="number" min="0" value={(((eq.cover||{})[dt]||{})[t.code]||{})[f.id]||0} onChange={e=>updCov(dt,t.code,f.id,+e.target.value||0)}/></td>)}</tr>)}
              {autoTurnos.length===0&&<tr><td colSpan={eq.funcoes.length+1} style={{color:"var(--muted)"}}>nenhum turno automático</td></tr>}</tbody></table></div>)}
        </div></div>

      <div data-sec="setor"><PainelDimensionamento eq={eq} onChange={updDim} onAplicar={aplicarDimensionamento}/></div>

      <div className="panel noprint" data-sec="setor"><h2>Tipos de licença / afastamento <span className="sp"></span><button className="btn sm" onClick={addLic}>+ tipo</button></h2>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:6}}>
          {S.licencas.map((l,i)=><div key={i} style={{display:"flex",gap:6}}><input className="code" value={l.code} disabled={l.code==="F"} onChange={e=>updLic(i,"code",e.target.value.toUpperCase().replace(/\s/g,"").slice(0,4))} style={{width:60,border:"1px solid var(--line)",borderRadius:7,padding:"5px 7px",fontFamily:"'JetBrains Mono'",fontWeight:700}}/>
            <input value={l.nome} onChange={e=>updLic(i,"nome",e.target.value)} style={{flex:1,border:"1px solid var(--line)",borderRadius:7,padding:"5px 8px"}}/>
            <button className="btn ghost sm" onClick={()=>rmLic(i)} disabled={l.code==="F"}>×</button></div>)}</div></div>

      <div className="panel noprint" data-sec="equipe"><h2>Acesso da equipe pelo celular</h2>
        <div style={{display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}><span>Código do setor <b>{eq.nome}</b>:</span><span className="codigo">{eq.codigo}</span>
          <button className="btn sm" onClick={()=>{navigator.clipboard&&navigator.clipboard.writeText(eq.codigo);}}>copiar</button>
          <button className="btn ghost sm" onClick={()=>{if(confirm("Gerar um novo código? O antigo deixa de funcionar."))updEq(x=>({...x,codigo:genCodigo(x.nome)}));}}>gerar novo</button></div>
        <div className="hint">Cada profissional abre {online?location.origin+location.pathname:"o app"} no celular → "Sou profissional da equipe" → digita este código, escolhe o nome e entra com o PIN de 4 dígitos que você definiu no cadastro. Pode adicionar à tela de início como app.</div></div>

      <div className="panel noprint" data-sec="equipe"><h2>Comunicado no portal · {eq.nome}</h2>
        <textarea value={(eq.aviso||{}).texto||""} placeholder="Ex.: Escala de outubro publicada. Pedidos de troca até dia 25. Reunião de equipe dia 30 às 14h." onChange={e=>updEq(x=>({...x,aviso:{texto:e.target.value,em:new Date().toLocaleDateString("pt-BR")}}))} style={{width:"100%",minHeight:70,border:"1px solid var(--line)",borderRadius:8,padding:"8px 10px",font:"inherit"}}/>
        <div className="hint">Aparece para todos deste setor ao entrarem no portal{(eq.aviso||{}).em?" · atualizado em "+eq.aviso.em:""}. É o canal de comunicação: avisos, decisões de troca e a escala ficam lá.</div></div>

      <div className="panel noprint" data-sec="equipe"><h2>Profissionais do setor <span className="sp"></span><button className="btn sm" onClick={agruparPorFuncao} title="Reordena juntando quem tem a mesma função">Agrupar por função</button></h2>
        {eq.profs.length===0?<div className="empty" style={{padding:"8px 0"}}>Nenhum profissional cadastrado — preencha o formulário abaixo.</div>:
        <table className="tb"><thead><tr><th style={{width:60}}>Ordem</th><th>Nome</th><th>Função <small style={{textTransform:"none",fontWeight:400}}>(digite qualquer profissão)</small></th><th>Carga semanal</th><th>Preferência · turnos permitidos</th><th>Alvo mensal</th><th></th></tr></thead><tbody>
          {eq.profs.map((p,i)=><tr key={p.id}>
            <td><div style={{display:"flex",gap:2}}><button className="btn sm" style={{padding:"2px 7px"}} disabled={i===0} onClick={()=>moveProf(p.id,-1)} title="Mover para cima">▲</button><button className="btn sm" style={{padding:"2px 7px"}} disabled={i===eq.profs.length-1} onClick={()=>moveProf(p.id,1)} title="Mover para baixo">▼</button></div></td>
            <td><input className="nm" value={p.nome} onChange={e=>updProf(p.id,"nome",e.target.value)}/></td>
            <td><FuncSelect funcoes={eq.funcoes} value={p.funcaoId} onSelect={id=>updProf(p.id,"funcaoId",id)} onCreate={n=>setFuncaoNome(p.id,n)}/></td>
            <td><input className="sm" type="number" value={p.weekly} onChange={e=>updProf(p.id,"weekly",+e.target.value||0)}/> h</td>
            <td><select value={p.pref||"misto"} onChange={e=>updProf(p.id,"pref",e.target.value)}>{["misto","mais_dia","mais_noite",...(["so_dia","so_noite"].includes(p.pref)?[p.pref]:[])].map(k=><option key={k} value={k}>{PREFS[k]}</option>)}</select>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>{eq.turnos.map(t=>{const sel=!Array.isArray(p.turnos)||!p.turnos.length||p.turnos.includes(t.code);return <label key={t.code} className="toggle" style={{fontSize:11,gap:3}} title={t.nome+" "+t.horas+"h"}><input type="checkbox" checked={sel} onChange={()=>toggleTurnoProf(p.id,t.code)}/>{t.code}</label>;})}</div></td>
            <td className="alvo">{alvo(p)}h</td>
            <td style={{whiteSpace:"nowrap"}}><button className={"btn sm"+(dossie===p.id?" primary":"")} onClick={()=>setDossie(dossie===p.id?null:p.id)} title="Nada consta, ASO, admissão, vínculo, certificações, PIN">📋 {dossie===p.id?"Fechar cadastro":"Cadastro completo"}</button> <button className="btn ghost sm" onClick={()=>rmProf(p.id)} title="Remover profissional">×</button></td></tr>
            ).flatMap((row,i)=>{const p=eq.profs[i];if(dossie!==p.id)return [row];const ds=p.dossie||{};const inp={border:"1px solid var(--line)",borderRadius:7,padding:"5px 8px",width:"100%"};
              return [row,<tr key={p.id+"-d"}><td colSpan={7} style={{background:"#f6fafa",padding:"10px 12px"}}><div className="glab" style={{fontSize:10,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase",color:"var(--teal-d)",marginBottom:8}}>Cadastro completo · {p.nome}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10}}>
                  <div className="field"><label>Registro no conselho</label><input style={inp} placeholder="ex.: COREN-BA 123456" value={ds.coren||""} onChange={e=>updDossie(p.id,"coren",e.target.value)}/></div>
                  <div className="field"><label>Anuidade do conselho até</label><input style={inp} type="date" value={ds.corenVal||""} onChange={e=>updDossie(p.id,"corenVal",e.target.value)}/></div>
                  <div className="field"><label>Nada consta — emitido em</label><input style={inp} type="date" value={ds.nadaConstaEm||""} onChange={e=>updDossie(p.id,"nadaConstaEm",e.target.value)}/></div>
                  <div className="field"><label>Nada consta — válido até</label><input style={inp} type="date" value={ds.nadaConstaVal||""} onChange={e=>updDossie(p.id,"nadaConstaVal",e.target.value)}/></div>
                  <div className="field"><label>ASO (periódico) válido até</label><input style={inp} type="date" value={ds.asoVal||""} onChange={e=>updDossie(p.id,"asoVal",e.target.value)}/></div>
                  <div className="field"><label>Admissão</label><input style={inp} type="date" value={ds.admissao||""} onChange={e=>updDossie(p.id,"admissao",e.target.value)}/></div>
                  <div className="field"><label>Vínculo</label><select style={inp} value={ds.vinculo||""} onChange={e=>updDossie(p.id,"vinculo",e.target.value)}><option value="">—</option><option>Efetivo / concursado</option><option>CLT</option><option>Contrato temporário</option><option>Terceirizado</option><option>Militar</option><option>Outro</option></select></div>
                  <div className="field"><label>Matrícula</label><input style={inp} value={ds.matricula||""} onChange={e=>updDossie(p.id,"matricula",e.target.value)}/></div>
                  <div className="field"><label>PIN do portal</label><div style={{display:"flex",gap:6,alignItems:"center"}}><span className="hint" style={{marginTop:0}}>{ds.pinHash?"definido ✓":"não definido"}</span><button className="btn sm" onClick={()=>definirPin(p.id)}>{ds.pinHash?"redefinir":"definir"}</button></div></div>
                  <div className="field"><label>Banco de horas — saldo inicial (h)</label><input style={inp} type="number" value={ds.saldoInicial??""} onChange={e=>updDossie(p.id,"saldoInicial",+e.target.value||0)}/></div>
                  <div className="field"><label>Telefone de contato</label><input style={inp} value={ds.telefone||""} onChange={e=>updDossie(p.id,"telefone",e.target.value)}/></div>
                </div>
                <div style={{marginTop:10}}><div className="field" style={{marginBottom:6}}><label>Certificações / treinamentos obrigatórios (com validade)</label></div>
                  {(ds.certs||[]).map((c,ci)=><div key={ci} style={{display:"flex",gap:6,marginBottom:5,maxWidth:560}}>
                    <input style={{...inp,flex:1}} placeholder="ex.: BLS/ACLS, NR-32, Segurança do Paciente" value={c.nome} onChange={e=>updCert(p.id,ci,"nome",e.target.value)}/>
                    <input style={{...inp,width:150}} type="date" value={c.val} onChange={e=>updCert(p.id,ci,"val",e.target.value)}/>
                    <button className="btn ghost sm" onClick={()=>rmCert(p.id,ci)}>×</button></div>)}
                  <button className="btn sm" onClick={()=>addCert(p.id)}>+ certificação</button></div>
                <div className="hint">Dados pessoais/profissionais: guarde só o necessário à coordenação (LGPD). Datas alimentam o painel de vencimentos.</div>
              </td></tr>];})}</tbody></table>}
        <div className="group" style={{marginTop:12}}><div className="glab">Novo profissional</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:10}}>
            <div className="field" style={{gridColumn:"span 2"}}><label>Nome completo</label><input style={{width:"100%"}} value={novo.nome} onChange={e=>setNovo({...novo,nome:e.target.value})}/></div>
            <div className="field"><label>Função</label><FuncSelect funcoes={eq.funcoes} value={novo.funcaoId||(eq.funcoes[0]||{}).id} onSelect={id=>setNovo({...novo,funcaoId:id})} onCreate={n=>{const nn=n.trim();let f=eq.funcoes.find(x=>x.nome.toLowerCase()===nn.toLowerCase());if(!f){f={id:uid(),nome:nn};updEq(e=>({...e,funcoes:[...e.funcoes,f]}));}setNovo({...novo,funcaoId:f.id});}}/></div>
            <div className="field"><label>Carga semanal (h)</label><input type="number" style={{width:"100%"}} placeholder={String(eq.defWeekly||36)} value={novo.weekly} onChange={e=>setNovo({...novo,weekly:e.target.value})}/></div>
            <div className="field"><label>Preferência</label><select value={novo.pref} onChange={e=>setNovo({...novo,pref:e.target.value})}>{["misto","mais_dia","mais_noite"].map(k=><option key={k} value={k}>{PREFS[k]}</option>)}</select></div>
            <div className="field" style={{gridColumn:"span 2"}}><label>Turnos que pode fazer</label><div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",padding:"6px 0"}}>
              {eq.turnos.map(t=>{const sel=!novo.turnos||novo.turnos.includes(t.code);return <label key={t.code} className="toggle" style={{fontSize:12}}><input type="checkbox" checked={sel} onChange={()=>{const all=eq.turnos.map(x=>x.code);let cur=novo.turnos?novo.turnos.slice():all.slice();cur=cur.includes(t.code)?cur.filter(c=>c!==t.code):[...cur,t.code];if(!cur.length)cur=[t.code];setNovo({...novo,turnos:cur.length===all.length?null:cur});}}/><span className={"chip "+cellClass(t.code)}>{t.code}</span>{t.nome} {t.horas}h</label>;})}
              <button className="btn sm" onClick={()=>{const c=novoTurnoRapido();if(c)setNovo({...novo,turnos:novo.turnos?[...novo.turnos,c]:null});}}>+ criar turno</button></div></div>
            <div className="field"><label>Registro no conselho</label><input style={{width:"100%"}} placeholder="COREN-BA 123456" value={novo.coren} onChange={e=>setNovo({...novo,coren:e.target.value})}/></div>
            <div className="field"><label>Validade da carteira</label><input type="date" style={{width:"100%"}} value={novo.corenVal} onChange={e=>setNovo({...novo,corenVal:e.target.value})}/></div>
            <div className="field"><label>Telefone de contato</label><input style={{width:"100%"}} placeholder="(71) 9 9999-0000" value={novo.telefone} onChange={e=>setNovo({...novo,telefone:e.target.value})}/></div>
            <div className="field"><label>PIN do portal (4 dígitos)</label><input inputMode="numeric" maxLength={4} style={{width:"100%",letterSpacing:4,textAlign:"center"}} value={novo.pin} onChange={e=>setNovo({...novo,pin:e.target.value.replace(/\D/g,"").slice(0,4)})}/></div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:10}}><button className="btn primary" disabled={!novo.nome.trim()} onClick={addProfCompleto}>Adicionar profissional</button><span className="hint" style={{marginTop:0}}>Ao adicionar, o cadastro completo da pessoa abre logo acima (nada consta, ASO, admissão, vínculo, certificações).</span></div></div></div>

      <div className="panel noprint" data-sec="docs"><h2>Documentos e conformidade · todos os setores</h2>
        {docsTabela.length===0?<div className="empty" style={{padding:"6px 0"}}>Nenhum profissional cadastrado.</div>:
        <div style={{overflowX:"auto"}}><table className="tb docs"><thead><tr><th>Setor</th><th>Nome</th><th>Função</th><th>Conselho</th><th>Anuidade</th><th>Nada consta</th><th>ASO</th><th>Certificações</th><th>Portal</th></tr></thead><tbody>
          {docsTabela.map((r,i)=><tr key={i}><td>{r.setor}</td><td><b>{r.nome}</b></td><td>{r.funcao}</td><td className="mono">{r.coren}</td><td className={r.anuidade[1]}>{r.anuidade[0]}</td><td className={r.nada[1]}>{r.nada[0]}</td><td className={r.aso[1]}>{r.aso[0]}</td>
            <td>{r.certs.length?r.certs.map(([n,st],j)=><div key={j} className={st[1]} style={{fontSize:12}}>{n}: {st[0]}</div>):"—"}</td><td>{r.pin?"✓ PIN":"—"}</td></tr>)}</tbody></table></div>}
        <div className="hint">Edite as datas no 📋 de cada profissional (seção Equipe). Verde: em dia · Amarelo: vence em 30 dias · Vermelho: vencido.</div></div>
      {vencimentos.length>0&&<div className="panel noprint" data-sec="docs"><h2>Vencimentos</h2>
        <div className="adv-list">{vencimentos.map((a,i)=><div className={"adv adv-"+a.sev} key={i}><span className="adv-ic">⚠</span><span>{a.text}</span></div>)}</div>
        <div className="hint">Mostra documentos vencidos ou que vencem em até 30 dias: anuidade e nada consta do conselho, ASO e certificações.</div></div>}

      <div className="panel noprint" data-sec="escala"><h2>Aplicar afastamento por período</h2>
        <div className="row">
          <div className="field"><label>Profissional</label><select value={lv.id} onChange={e=>setLv({...lv,id:e.target.value})} style={{minWidth:170}}><option value="">— selecione —</option>{eq.profs.map(p=><option key={p.id} value={p.id}>{p.nome}</option>)}</select></div>
          <div className="field"><label>Tipo</label><select value={lv.tipo} onChange={e=>setLv({...lv,tipo:e.target.value})}>{S.licencas.map(l=><option key={l.code} value={l.code}>{l.code} · {l.nome}</option>)}</select></div>
          <div className="field"><label>Do dia</label><input type="number" min="1" max={dim} value={lv.a} onChange={e=>setLv({...lv,a:+e.target.value||1})}/></div>
          <div className="field"><label>Até o dia</label><input type="number" min="1" max={dim} value={lv.b} onChange={e=>setLv({...lv,b:+e.target.value||1})}/></div>
          <button className="btn primary" onClick={aplicarAfast}>Aplicar</button></div>
        <div className="hint">Afastamentos e turnos manuais são preservados ao clicar em “Gerar escala”.</div></div>

      <div data-sec="equipe"><PainelFerias eq={eq} ano={ano} onAdd={addFer} onUpd={updFer} onRm={rmFer} onAplicar={aplicarFerias}/></div>

      <div className="grid-scroll">
        {eq.profs.length===0?<div className="empty">Cadastre a equipe e clique em “Gerar escala”.</div>:
        <table className="sched"><thead><tr><th className="name-col">Profissional</th>
          {days.map(d=><th key={d} className={isHol(d)?"hol":isWknd(ano,mes,d)?"wknd":""}><div className="dwd">{WD[wdOf(ano,mes,d)]}</div><div className="dnum">{d}</div>{isHol(d)&&<div className="fer">FER</div>}</th>)}
          <th className="tot-col">Carga / Balanço</th></tr></thead>
        <tbody>{eq.profs.map(p=>{const r=sched[p.id]||{};const h=totais[p.id]||0;const t=alvo(p);const f=eq.funcoes.find(x=>x.id===p.funcaoId);
          const idx=eq.profs.indexOf(p);
          return <tr key={p.id}><td className="name-col"><div style={{display:"flex",alignItems:"center",gap:6}}>
              <div className="noprint" style={{display:"flex",flexDirection:"column",gap:1}}><button className="btn sm" style={{padding:"0 5px",lineHeight:"14px",fontSize:9}} disabled={idx===0} onClick={()=>moveProf(p.id,-1)} title="Mover para cima">▲</button><button className="btn sm" style={{padding:"0 5px",lineHeight:"14px",fontSize:9}} disabled={idx===eq.profs.length-1} onClick={()=>moveProf(p.id,1)} title="Mover para baixo">▼</button></div>
              <div><div className="nm-main">{p.nome}</div><div className="nm-tags">{(f?f.nome:"").toUpperCase().slice(0,14)} · {p.weekly}h · {Array.isArray(p.turnos)&&p.turnos.length?"só "+p.turnos.join("/"):PREFS[p.pref]||"misto"}</div></div></div></td>
            {days.map(d=>{const code=(verOriginal&&orig?((orig.sched[p.id]||{})[d]||""):(r[d]||""));return <td key={d} className={isHol(d)?"hol":isWknd(ano,mes,d)?"wknd":""}>
              {verOriginal&&orig?<div className={"chip "+cellClass(code)} style={{width:"100%",borderRadius:0,height:36}}>{code||"·"}</div>:
              <React.Fragment><span className="cell-print" style={{display:"none"}}>{code||""}</span><select className={"cell-sel "+cellClass(code)} value={code} onChange={e=>setCell(p.id,d,e.target.value)}>
                <option value="">·</option><optgroup label="Turnos">{eq.turnos.map(t=><option key={t.code} value={t.code}>{t.code}</option>)}</optgroup>
                <optgroup label="Licenças">{S.licencas.map(l=><option key={l.code} value={l.code}>{l.code}</option>)}</optgroup></select></React.Fragment>}</td>;})}
            <td className="tot-col"><div className="tot-wrap" style={{flexDirection:"column",alignItems:"flex-end",gap:1,height:"auto",padding:"3px 12px"}}><div style={{display:"flex",gap:8,alignItems:"center"}}><span className="tot-h mono">{h}h</span>{pill(h,t)}</div>
              <div className="nm-tags" style={{marginTop:0}}>{Object.entries(resumoProf[p.id]||{}).map(([k,v])=>k+" "+v).join(" · ")||"—"}</div></div></td></tr>;})}</tbody>
        <tfoot>
          {eq.turnos.map(t=><tr className="sum" key={"s"+t.code}><td className="name-col cov-lbl">Total {t.code} <small>· {t.nome}</small></td>
            {days.map(d=>{const c=resumoDia[d].porTurno[t.code]||0;return <td key={d} className={isHol(d)?"hol":isWknd(ano,mes,d)?"wknd":""}>{c||""}</td>;})}<td className="tot-col"></td></tr>)}
          <tr className="sum"><td className="name-col cov-lbl">Em plantão no dia</td>
            {days.map(d=>{const c=resumoDia[d].plantao;return <td key={d} className={(isHol(d)?"hol ":isWknd(ano,mes,d)?"wknd ":"")+(c===0&&eq.profs.length?"zero":"")}>{c}</td>;})}<td className="tot-col"></td></tr>
          <tr className="sum"><td className="name-col cov-lbl">Folga / afastados</td>
            {days.map(d=><td key={d} className={isHol(d)?"hol":isWknd(ano,mes,d)?"wknd":""} style={{color:"var(--muted)"}}>{resumoDia[d].fora||""}</td>)}<td className="tot-col"></td></tr>
          {autoTurnos.map(t=>eq.funcoes.map(f=><tr key={t.code+f.id}>
          <td className="name-col cov-lbl">{t.code} {f.nome.slice(0,10)} <small>· sem {(((eq.cover||{}).semana||{})[t.code]||{})[f.id]||0} / fds {(((eq.cover||{}).fds||{})[t.code]||{})[f.id]||0}</small></td>
          {days.map(d=>{const c=(coverage[d][t.code]||{})[f.id]||0;const need=req(d,t.code,f.id);return <td key={d} className={(isHol(d)?"hol ":isWknd(ano,mes,d)?"wknd ":"")+(c<need?"under":"")}>{c||""}</td>;})}
          <td className="tot-col"></td></tr>))}</tfoot></table>}
      </div>

      <div className="legend noprint print-show" data-sec="escala" data-flex="1">
        {eq.turnos.map(t=><span key={t.code}><i className={"chip "+cellClass(t.code)}>{t.code}</i>{t.nome} {t.horas}h</span>)}
        {S.licencas.map(l=><span key={l.code}><i className={"chip "+cellClass(l.code)}>{l.code}</i>{l.nome}</span>)}
        <BtnCap cap="mantém licenças e turnos manuais"><button className="btn ghost sm" style={{marginLeft:"auto"}} onClick={limpar}>Limpar plantões automáticos</button></BtnCap>
      </div>

      {eq.profs.length>0&&<div style={{marginTop:14}} data-sec="trocas"><PainelTroca eq={eq} sched={sched} turnoMap={turnoMap} dim={dim} onTrocar={trocar} log={((eq.trocas||{})[ym])||[]}/></div>}

      {eq.profs.length>0&&<div data-sec="trocas"><PainelSolicitacoes eq={eq} sched={sched} turnoMap={turnoMap} dim={dim} sols={solsDe(eq.id,ym)} onAutorizar={x=>decidirTroca(x,true)} onNegar={x=>decidirTroca(x,false)} onAvisar={avisar} mesLabel={MESES[mes]+"/"+ano}/>
        <div className="panel noprint"><h2>Histórico de pedidos de troca · todos os meses</h2>
          {(()=>{const all=[];solsDe(eq.id,null).forEach(x=>all.push({k:x.ym,...x}));Object.entries(eq.trocas||{}).forEach(([k,arr])=>arr.forEach((x,i)=>all.push({k,manual:true,id:"m"+k+i,...x})));
            all.sort((a,b)=>b.k.localeCompare(a.k));const nm=id=>(eq.profs.find(p=>p.id===id)||{}).nome||"?";const lbl=k=>{const [yy,mm]=k.split("-");return MESES[+mm].slice(0,3)+"/"+yy;};
            const ST={aguardando_colega:"aguardando colega",aguardando_coordenador:"aguardando coordenador",autorizada:"autorizada",negada:"negada",recusada:"recusada pelo colega"};
            return all.length===0?<div className="empty" style={{padding:"6px 0"}}>Nenhum pedido registrado.</div>:
            <table className="tb"><thead><tr><th>Mês</th><th>Quem cede</th><th>Dia</th><th>Quem cede</th><th>Dia</th><th>Origem</th><th>Situação</th><th>Comentário</th></tr></thead><tbody>
              {all.map(x=><tr key={x.id||x.k+x.diaDe}><td className="mono">{lbl(x.k)}</td><td>{x.manual?x.de:nm(x.de)}</td><td className="mono">{x.diaDe}</td><td>{x.manual?x.para:nm(x.para)}</td><td className="mono">{x.diaPara}</td><td>{x.manual?"coordenador":"portal"}</td>
                <td style={{color:x.manual||x.status==="autorizada"?"var(--ok)":x.status.startsWith("aguard")?"var(--warn)":"var(--bad)",fontWeight:600}}>{x.manual?"feita pelo coordenador"+(x.em?" em "+x.em:""):(ST[x.status]||x.status)+(x.decididoEm?" em "+x.decididoEm:"")}</td><td>{x.comentario||""}</td></tr>)}</tbody></table>;})()}
          <div className="hint">Fica salvo com a equipe (backup e nuvem). Pedidos do portal e trocas feitas por você aparecem juntos.</div></div></div>}

      {eq.profs.length>0&&<div className="panel noprint" data-sec="escala"><h2>Diagnóstico e orientações</h2>
        <div className="adv-list">{advice.map((a,i)=><div className={"adv adv-"+a.sev} key={i}><span className="adv-ic">{a.sev==="ok"?"✓":a.sev==="info"?"→":"⚠"}</span><span>{a.text}</span></div>)}</div>
        <div className="hint">Atualiza sozinho conforme você edita a escala, a equipe ou a cobertura.</div></div>}

      {eq.profs.length>0&&<div className="panel noprint" data-sec="escala"><h2>Balanço de carga horária</h2>
        {eq.profs.map(p=>{const h=totais[p.id]||0,t=alvo(p),d=h-t;const cls=Math.abs(d)<12?"var(--ok)":Math.abs(d)<24?"var(--warn)":"var(--bad)";
          return <div className="bal-row" key={p.id}><div className="bal-name">{p.nome} <span style={{color:"var(--muted)",fontWeight:400,fontSize:11}}>· alvo {t}h · {(fdsCount[p.id]||0)-(ferCount[p.id]||0)} fds · {ferCount[p.id]||0} feriado(s) · banco <b style={{color:(banco[p.id]||0)>=0?"var(--ok)":"var(--bad)"}}>{(banco[p.id]||0)>0?"+":""}{banco[p.id]||0}h</b></span></div>
            <div className="bar-track"><div className="bar-fill" style={{width:Math.min(100,h/maxH*100)+"%",background:cls}}></div><div className="bar-target" style={{left:(t/maxH*100)+"%"}}></div></div>
            <div className="bar-info"><span className="tot-h mono">{h}h</span>{pill(h,t)}</div></div>;})}
        <div className="hint">Linha preta = alvo individual. Verde ±12h · Amarelo até ±24h · Vermelho acima. Banco = saldo acumulado dos meses gerados (+ saldo inicial do cadastro).</div></div>}

      {indic&&<div className="panel noprint" data-sec="indic"><h2>Indicadores do mês · {eq.nome} <span className="sp"></span><BtnCap cap="apresentação pronta em PowerPoint"><button className="btn primary sm" onClick={gerarSlides}>📽 Gerar slides para a diretoria</button></BtnCap></h2>
        <div className="row">
          <div className="stat"><div className="k">Absenteísmo (licenças)</div><div className="v">{indic.abs.toFixed(1)}%</div></div>
          <div className="stat"><div className="k">Férias no mês</div><div className="v">{indic.ferias.toFixed(1)}%</div></div>
          <div className="stat"><div className="k">Horas acima do alvo</div><div className="v">{indic.extra}h</div></div>
          <div className="stat"><div className="k">Cobertura atendida</div><div className="v" style={{color:indic.cob<100?"var(--bad)":"var(--teal-d)"}}>{indic.cob.toFixed(0)}%</div></div>
          <div className="stat"><div className="k">Fds por pessoa</div><div className="v">{indic.fdsMin}–{indic.fdsMax} <small style={{fontSize:11,color:"var(--muted)"}}>média {indic.fdsMed.toFixed(1)}</small></div></div>
          <div className="stat"><div className="k">Feriados por pessoa</div><div className="v">{Math.min(...eq.profs.map(p=>ferCount[p.id]||0))}–{Math.max(...eq.profs.map(p=>ferCount[p.id]||0))}</div></div>
          <div className="stat"><div className="k">Banco de horas (equipe)</div><div className="v" style={{color:indic.bancoTot>=0?"var(--teal-d)":"var(--bad)"}}>{indic.bancoTot>0?"+":""}{indic.bancoTot}h</div></div>
          {indic.porFuncao.map(f=><div className="stat" key={f.nome}><div className="k">{f.nome}</div><div className="v">{f.n}</div></div>)}
        </div>
        <div className="hint">Absenteísmo = dias de licença (exceto folga e férias) ÷ (pessoas × dias do mês). Cobertura = vagas exigidas atendidas ÷ vagas exigidas.</div></div>}
      </>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
